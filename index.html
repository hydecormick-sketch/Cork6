<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Rush 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bc9e8;font-family:Arial,sans-serif}
#hud{position:absolute;top:18px;left:20px;color:white;text-shadow:0 2px 8px #17334d;pointer-events:none}
#logo{font-size:25px;font-weight:900;letter-spacing:3px;margin-bottom:12px}
.stat{font-size:16px;margin:7px 0;font-weight:bold}
#mapSelect{pointer-events:auto;font-weight:bold;border:0;border-radius:5px;padding:5px}
#trickText{color:#ffe17c;font-size:20px;margin-top:10px}
#controls{position:absolute;bottom:15px;left:20px;color:white;text-shadow:0 2px 5px #17334d;font-size:13px;line-height:1.8}
#centerMessage{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;color:white;text-shadow:0 3px 12px #18344d;pointer-events:none;text-align:center}
#centerMessage h1{font-size:clamp(35px,7vw,76px);margin:0;letter-spacing:5px}
#centerMessage p{font-size:18px;font-weight:bold}
#progressOuter{position:absolute;top:20px;right:22px;width:150px;height:8px;background:#ffffff66;border-radius:10px;overflow:hidden}
#progress{height:100%;width:0%;background:white}
</style>
</head>
<body>

<div id="hud">
  <div id="logo">ALPINE RUSH</div>
  <div class="stat" id="speed">SPEED 0 KM/H</div>
  <div class="stat" id="score">SCORE 0</div>
  <div class="stat" id="distance">DISTANCE 0 M</div>
  <div class="stat" id="tricks">TRICKS 0</div>
  <div class="stat">MAP:
    <select id="mapSelect">
      <option value="alpine">Alpine Peaks</option>
      <option value="forest">Frozen Forest</option>
      <option value="volcano">Volcano Ridge</option>
      <option value="extreme">Extreme Park</option>
    </select>
  </div>
  <div id="trickText"></div>
</div>

<div id="progressOuter"><div id="progress"></div></div>
<div id="controls">
A / D or ← / → — Steer<br>
W — Accelerate / Backflip in air<br>
S — Brake / Frontflip in air<br>
SPACE — Jump<br>
R — Restart
</div>
<div id="centerMessage">
<h1>ALPINE RUSH</h1>
<p>PRESS SPACE TO START</p>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

// =====================================
// MAP CONFIGURATION
// =====================================

const MAPS={
 alpine:{
  name:"Alpine Peaks",sky:0x9bc9e8,snow:0xf0f7ff,
  slope:0.027,wave:1.1,
  trees:[0x164b3b,0x205a43,0x286448],
  ramps:[-250,-590,-940,-1320,-1660],
  rails:[-390,-800,-1150,-1500]
 },
 forest:{
  name:"Frozen Forest",sky:0x9ab9d0,snow:0xe1eff8,
  slope:0.035,wave:1.8,
  trees:[0x123b38,0x1b5046,0x27604f],
  ramps:[-330,-850,-1450],
  rails:[-520,-1050,-1650]
 },
 volcano:{
  name:"Volcano Ridge",sky:0xc3a6a0,snow:0xe5e0dc,
  slope:0.023,wave:2.5,
  trees:[0x45413d,0x665348,0x514c48],
  ramps:[-220,-650,-1100,-1600],
  rails:[-430,-900,-1400]
 },
 extreme:{
  name:"Extreme Park",sky:0x829fca,snow:0xe5f0ff,
  slope:0.032,wave:1.5,
  trees:[0x173e37,0x235647,0x315c49],
  ramps:[-180,-400,-720,-1000,-1300,-1650],
  rails:[-300,-570,-880,-1200,-1510,-1800]
 }
};

let currentMap="alpine";
let MAP=MAPS[currentMap];

const scene=new THREE.Scene();
scene.background=new THREE.Color(MAP.sky);
scene.fog=new THREE.Fog(MAP.sky,100,420);

const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,0.1,1000);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6f5ff,0x647b91,2));

const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-80,120,70);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

// =====================================
// COURSE AND TERRAIN
// =====================================

const COURSE_LENGTH=2000;
const FINISH_Z=-COURSE_LENGTH;

function groundHeight(x,z){
 let h=22-z*MAP.slope+
 Math.sin(z*0.025)*MAP.wave+
 Math.sin(x*0.12+z*0.018)*0.7+
 Math.sin(x*0.045)*0.5;

 for(const ramp of MAP.ramps){
  const d=(z-ramp)/15;
  h+=5.5*Math.exp(-d*d);
 }
 return h;
}

function makeTerrain(){
 const positions=[],indices=[];
 const NX=90,NZ=1200;

 for(let iz=0;iz<=NZ;iz++){
  const z=90-iz*(COURSE_LENGTH+180)/NZ;
  for(let ix=0;ix<=NX;ix++){
   const x=-55+ix*110/NX;
   positions.push(x,groundHeight(x,z),z);
  }
 }

 for(let iz=0;iz<NZ;iz++){
  for(let ix=0;ix<NX;ix++){
   const a=iz*(NX+1)+ix,b=a+1,c=a+NX+1,d=c+1;
   indices.push(a,c,b,b,c,d);
  }
 }

 const geo=new THREE.BufferGeometry();
 geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
 geo.setIndex(indices);
 geo.computeVertexNormals();

 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
  color:MAP.snow,roughness:0.95,side:THREE.DoubleSide
 }));
 mesh.receiveShadow=true;
 scene.add(mesh);

 for(const side of [-1,1]){
  const wall=new THREE.Mesh(
   new THREE.BoxGeometry(20,70,COURSE_LENGTH+200),
   new THREE.MeshStandardMaterial({color:0xc9deeb})
  );
  wall.position.set(side*65,16,-COURSE_LENGTH/2);
  scene.add(wall);
 }
}

const peakMaterial=new THREE.MeshStandardMaterial({color:0xdcebf5});
for(let i=0;i<24;i++){
 const peak=new THREE.Mesh(
  new THREE.ConeGeometry(18+Math.random()*20,45+Math.random()*45,5),
  peakMaterial
 );
 peak.position.set((Math.random()-.5)*400,25+Math.random()*25,-100-Math.random()*2200);
 scene.add(peak);
}

// =====================================
// TREES AND OBSTACLES
// =====================================

const obstacles=[];
const treeGreen=MAP.trees;
const trunkMat=new THREE.MeshStandardMaterial({color:0x65432d});

function addTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.17,.25,1.8,7),trunkMat);
 trunk.position.y=.9;
 trunk.castShadow=true;
 group.add(trunk);

 for(let i=0;i<3;i++){
  const cone=new THREE.Mesh(
   new THREE.ConeGeometry(1.25-i*.23,2,7),
   new THREE.MeshStandardMaterial({color:treeGreen[Math.floor(Math.random()*treeGreen.length)]})
  );
  cone.position.y=1.9+i*.85;
  cone.castShadow=true;
  group.add(cone);
 }

 group.position.set(x,groundHeight(x,z),z);
 scene.add(group);
 obstacles.push({x,z,radius:1.15});
}

for(let z=-35;z>FINISH_Z+30;z-=18){
 for(const side of [-1,1]){
  if(Math.random()>.12)addTree(side*(17+Math.random()*23),z);
 }
}

// =====================================
// RAMPS
// =====================================

const rampMaterial=new THREE.MeshStandardMaterial({
 color:0x4e91b5,roughness:.65,metalness:.1
});

for(const z of MAP.ramps){
 const ramp=new THREE.Mesh(
  new THREE.BoxGeometry(9,.65,15),rampMaterial
 );
 ramp.position.set(0,groundHeight(0,z)+.35,z);
 ramp.rotation.x=-.16;
 ramp.castShadow=true;
 ramp.receiveShadow=true;
 scene.add(ramp);

 const lip=new THREE.Mesh(
  new THREE.BoxGeometry(9,.3,1.2),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 lip.position.set(0,groundHeight(0,z-5)+1,z-5);
 scene.add(lip);
}

// =====================================
// RAILS
// =====================================

const rails=[];
const railMaterial=new THREE.MeshStandardMaterial({
 color:0xd7e5ed,metalness:.85,roughness:.22
});
const postMaterial=new THREE.MeshStandardMaterial({
 color:0x394b5a,metalness:.55
});

for(const z of MAP.rails){
 const x=(Math.random()-.5)*12;
 const length=17;
 const rail=new THREE.Group();

 const beam=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.13,length,12),railMaterial
 );
 beam.rotation.x=Math.PI/2;
 beam.castShadow=true;
 rail.add(beam);

 for(const offset of [-5,0,5]){
  const post=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,.15,1.1,8),postMaterial
  );
  post.position.set(0,-.55,offset);
  rail.add(post);
 }

 const y=groundHeight(x,z)+2;
 rail.position.set(x,y,z);
 scene.add(rail);

 rails.push({x,z,y,length});
}

// =====================================
// GATES AND FINISH
// =====================================

const gates=[];
const gateMaterial=new THREE.MeshStandardMaterial({color:0xffb832});

for(let z=-130;z>FINISH_Z+80;z-=115){
 const x=(Math.random()-.5)*12;
 const gate=new THREE.Group();

 for(const side of [-1,1]){
  const post=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,.12,3.4,8),gateMaterial
  );
  post.position.set(side*2.1,1.7,0);
  gate.add(post);
 }

 const bar=new THREE.Mesh(
  new THREE.BoxGeometry(4.3,.16,.16),gateMaterial
 );
 bar.position.y=3.3;
 gate.add(bar);
 gate.position.set(x,groundHeight(x,z),z);
 scene.add(gate);
 gates.push({x,z,passed:false});
}

const finish=new THREE.Group();
const finishMat=new THREE.MeshStandardMaterial({color:0x2b5d91});
for(const side of [-1,1]){
 const post=new THREE.Mesh(new THREE.BoxGeometry(.6,7,.6),finishMat);
 post.position.set(side*7,3.5,0);
 finish.add(post);
}
const finishBar=new THREE.Mesh(new THREE.BoxGeometry(14.5,.7,.7),finishMat);
finishBar.position.y=7;
finish.add(finishBar);
finish.position.set(0,groundHeight(0,FINISH_Z),FINISH_Z);
scene.add(finish);

// =====================================
// SKIER
// =====================================

const skier=new THREE.Group();
scene.add(skier);
const body=new THREE.Group();
skier.add(body);

const jacketMat=new THREE.MeshStandardMaterial({color:0xf04d36});
const pantsMat=new THREE.MeshStandardMaterial({color:0x172d48});
const helmetMat=new THREE.MeshStandardMaterial({color:0xffcf45});
const skiMat=new THREE.MeshStandardMaterial({color:0x192a3b});

function part(parent,geo,mat,x,y,z){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

part(body,new THREE.BoxGeometry(.55,.8,.4),jacketMat,0,1.05,0);
part(body,new THREE.SphereGeometry(.26,20,16),helmetMat,0,1.68,0);

for(const side of [-1,1]){
 part(body,new THREE.BoxGeometry(.2,.55,.22),pantsMat,side*.17,.42,0);
 part(body,new THREE.BoxGeometry(.2,.09,2.3),skiMat,side*.22,.08,-.15);

 const tip=part(body,new THREE.SphereGeometry(.105,12,10),skiMat,side*.22,.08,-1.28);
 tip.scale.set(1,.5,1.5);

 const arm=part(body,new THREE.CylinderGeometry(.075,.09,.72,8),jacketMat,side*.4,1,-.05);
 arm.rotation.z=side*-.55;
}

// =====================================
// SNOW PARTICLES
// =====================================

const snowCount=500;
const snowPositions=new Float32Array(snowCount*3);
for(let i=0;i<snowCount;i++){
 snowPositions[i*3]=(Math.random()-.5)*80;
 snowPositions[i*3+1]=Math.random()*35+2;
 snowPositions[i*3+2]=-Math.random()*100;
}

const snowGeo=new THREE.BufferGeometry();
snowGeo.setAttribute("position",new THREE.BufferAttribute(snowPositions,3));

const snowParticles=new THREE.Points(
 snowGeo,new THREE.PointsMaterial({color:0xffffff,size:.12,transparent:true,opacity:.8})
);
scene.add(snowParticles);

// =====================================
// GAME STATE
// =====================================

const keys={};
let started=false,finished=false,crashed=false;
let speed=0,lateralVelocity=0,score=0,trickCount=0,distance=0;
let airborne=false,verticalVelocity=0;
let flipActive=false,flipRotation=0,flipDirection=0,airTime=0;
let grinding=false,grindTime=0,currentRail=null;
let lastRamp=-1;
let lastTrickTimer=0;

function showTrick(text){
 const el=document.getElementById("trickText");
 el.textContent=text;
 lastTrickTimer=1.5;
}

function startGame(){
 started=true;
 finished=false;
 crashed=false;
 speed=10;
 lateralVelocity=0;
 score=0;
 trickCount=0;
 distance=0;
 airborne=false;
 verticalVelocity=0;
 flipActive=false;
 flipRotation=0;
 flipDirection=0;
 airTime=0;
 grinding=false;
 grindTime=0;
 currentRail=null;
 lastRamp=-1;

 skier.position.set(0,groundHeight(0,0)+.2,0);
 skier.rotation.set(0,0,0);
 body.rotation.set(0,0,0);
 gates.forEach(g=>g.passed=false);

 document.getElementById("centerMessage").innerHTML="";
 document.getElementById("trickText").textContent="";
 document.getElementById("progress").style.width="0%";
}

function endGame(title,subtitle){
 finished=true;
 document.getElementById("centerMessage").innerHTML=
 `<h1>${title}</h1><p>${subtitle}</p><p>FINAL SCORE: ${Math.floor(score).toLocaleString()}</p><p>PRESS R TO PLAY AGAIN</p>`;
}

function crash(){
 if(crashed||finished)return;
 crashed=true;
 speed=0;
 document.getElementById("centerMessage").innerHTML=
 "<h1>WIPEOUT!</h1><p>PRESS R TO TRY AGAIN</p>";
}

// =====================================
// INPUT
// =====================================

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.code==="Space"){
  e.preventDefault();
  if(!started||finished||crashed){
   startGame();
  }else if(!airborne){
   airborne=true;
   verticalVelocity=8.5+speed*.12;
   airTime=0;
  }
 }

 if(e.key.toLowerCase()==="r")startGame();
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

document.getElementById("mapSelect").addEventListener("change",e=>{
 const selected=e.target.value;
 location.search="?map="+selected;
});

// =====================================
// PHYSICS
// =====================================

function updatePhysics(dt){
 if(!started||finished||crashed)return;

 const oldZ=skier.position.z;

 // Steering and carving
 let steering=0;
 if(keys.a||keys.arrowleft)steering-=1;
 if(keys.d||keys.arrowright)steering+=1;

 const carvePower=12+speed*.35;
 lateralVelocity+=steering*carvePower*dt;
 lateralVelocity*=Math.pow(.90,dt*60);
 lateralVelocity=THREE.MathUtils.clamp(lateralVelocity,-12,12);
 skier.position.x+=lateralVelocity*dt;

 // Slope-based acceleration
 const here=groundHeight(skier.position.x,skier.position.z);
 const ahead=groundHeight(skier.position.x,skier.position.z-1);
 const slopeDrop=here-ahead;

 let acceleration=9.8*slopeDrop-speed*.025;
 if(keys.w&&!airborne)acceleration+=5;
 if(keys.s&&!airborne)acceleration-=10;

 speed+=acceleration*dt;
 speed=THREE.MathUtils.clamp(speed,3,34);

 skier.position.z-=speed*dt;
 distance=Math.max(0,-skier.position.z);

 const ground=groundHeight(skier.position.x,skier.position.z);

 // Automatic ramps
 for(let i=0;i<MAP.ramps.length;i++){
  const ramp=MAP.ramps[i];
  if(lastRamp!==i&&oldZ>ramp+2&&skier.position.z<=ramp+2&&skier.position.z>ramp-12){
   airborne=true;
   verticalVelocity=8+speed*.18;
   airTime=0;
   lastRamp=i;
   showTrick("JUMP!");
  }
 }

 // Air physics
 if(airborne){
  airTime+=dt;
  verticalVelocity-=19*dt;
  skier.position.y+=verticalVelocity*dt;

  // W backflip, S frontflip
  let direction=0;
  if(keys.w)direction=1;
  if(keys.s)direction=-1;

  if(direction!==0&&!flipActive){
   flipActive=true;
   flipDirection=direction;
   flipRotation=0;
   showTrick(direction===1?"BACKFLIP!":"FRONTFLIP!");
  }

  if(flipActive){
   flipRotation+=dt*7.5;
   body.rotation.x=flipRotation*flipDirection;

   if(flipRotation>=Math.PI*2){
    flipActive=false;
    body.rotation.x=0;
    flipRotation=0;
    trickCount++;
    score+=600;
    showTrick("FLIP +600");
   }
  }

  // Landing
  if(skier.position.y<=ground+.2&&verticalVelocity<0){
   skier.position.y=ground+.2;

   if(airTime>.35){
    if(flipActive){
     crash();
    }else{
     const bonus=Math.floor(airTime*100);
     score+=bonus;
     showTrick("CLEAN LANDING +"+bonus);
    }
   }

   airborne=false;
   verticalVelocity=0;
   body.rotation.x=0;
   flipActive=false;
   flipRotation=0;
   flipDirection=0;
  }
 }else{
  skier.position.y=ground+.2;
 }

 // Rail grinding: align and ride along rail
 let touchingRail=null;
 if(!airborne){
  for(const rail of rails){
   const along=Math.abs(skier.position.z-rail.z);
   const across=Math.abs(skier.position.x-rail.x);
   if(along<rail.length/2&&across<1.15&&Math.abs(skier.position.y-rail.y)<2.8){
    touchingRail=rail;
    break;
   }
  }
 }

 if(touchingRail){
  if(!grinding)showTrick("RAIL GRIND!");
  grinding=true;
  currentRail=touchingRail;
  grindTime+=dt;
  skier.position.x=THREE.MathUtils.lerp(skier.position.x,touchingRail.x,.35);
  skier.position.y=touchingRail.y+.35;
  lateralVelocity*=.75;
  score+=120*dt;
 }else{
  grinding=false;
  currentRail=null;
  grindTime=0;
 }

 // Lean into turns
 const desiredLean=-lateralVelocity*.055;
 skier.rotation.z=THREE.MathUtils.lerp(skier.rotation.z,desiredLean,1-Math.pow(.001,dt));
 skier.rotation.y=THREE.MathUtils.lerp(skier.rotation.y,-lateralVelocity*.035,1-Math.pow(.001,dt));

 // Score for skiing
 score+=speed*dt*1.4;

 // Boundaries
 if(Math.abs(skier.position.x)>43)crash();

 // Tree collisions
 for(const obstacle of obstacles){
  if(Math.abs(skier.position.z-obstacle.z)>2.5)continue;
  const dx=skier.position.x-obstacle.x;
  const dz=skier.position.z-obstacle.z;
  if(Math.hypot(dx,dz)<obstacle.radius+.45&&!airborne){
   crash();
   break;
  }
 }

 // Gates
 for(const gate of gates){
  if(!gate.passed&&oldZ>gate.z&&skier.position.z<=gate.z){
   gate.passed=true;
   if(Math.abs(skier.position.x-gate.x)<2.5){
    score+=250;
    showTrick("GATE BONUS +250");
   }
  }
 }

 // Finish
 if(skier.position.z<=FINISH_Z){
  endGame("RUN COMPLETE!","YOU MADE IT DOWN THE MOUNTAIN");
 }

 document.getElementById("speed").textContent="SPEED "+Math.round(speed*3.6)+" KM/H";
 document.getElementById("score").textContent="SCORE "+Math.floor(score).toLocaleString();
 document.getElementById("distance").textContent="DISTANCE "+Math.floor(distance)+" M";
 document.getElementById("tricks").textContent="TRICKS "+trickCount;
 document.getElementById("progress").style.width=Math.min(100,distance/COURSE_LENGTH*100)+"%";
}

// =====================================
// CAMERA
// =====================================

function updateCamera(dt){
 const desired=new THREE.Vector3(
  skier.position.x*.65,
  skier.position.y+5.8,
  skier.position.z+13+speed*.06
 );

 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(skier.position.x,skier.position.y+1,skier.position.z-11);
 camera.rotation.z=THREE.MathUtils.lerp(camera.rotation.z,-lateralVelocity*.006,.06);
}

// =====================================
// SNOW
// =====================================

function updateSnow(dt){
 const p=snowGeo.attributes.position;
 for(let i=0;i<snowCount;i++){
  p.array[i*3+1]-=3*dt;
  p.array[i*3+2]+=speed*dt*.6;
  if(p.array[i*3+1]<0)p.array[i*3+1]=30;
  if(p.array[i*3+2]>15)p.array[i*3+2]=-100;
 }
 p.needsUpdate=true;
}

// =====================================
// MAIN LOOP
// =====================================

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);

 updatePhysics(dt);
 updateCamera(dt);
 updateSnow(dt);

 if(lastTrickTimer>0){
  lastTrickTimer-=dt;
  if(lastTrickTimer<=0)document.getElementById("trickText").textContent="";
 }

 renderer.render(scene,camera);
}

skier.position.set(0,groundHeight(0,0)+.2,0);
camera.position.set(0,12,15);
camera.lookAt(0,5,-10);

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
