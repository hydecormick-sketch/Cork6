
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Rush 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #9ac9e8; font-family: Arial; }
  #hud {
    position: absolute; top: 18px; left: 20px; color: white;
    font-size: 19px; font-weight: bold; text-shadow: 1px 2px 4px #234;
    pointer-events: none;
  }
  #help {
    position: absolute; bottom: 18px; left: 20px; color: white;
    text-shadow: 1px 2px 4px #234; font-size: 14px;
  }
  #message {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: white; font-size: 30px; font-weight: bold;
    text-shadow: 2px 3px 5px #234; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div>ALPINE RUSH</div>
  <div id="speed">Speed: 0 km/h</div>
  <div id="score">Score: 0</div>
  <div id="tricks">Tricks: 0</div>
</div>
<div id="help">A/D or ←/→: Steer | SPACE: Jump | F: Flip | R: Restart</div>
<div id="message">3D SKIING</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ac9e8);
scene.fog = new THREE.Fog(0x9ac9e8, 70, 260);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff, 0x829bb2, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-30, 60, 40);
sun.castShadow = true;
scene.add(sun);

// MOUNTAIN
function mountainHeight(x, z) {
  return 7 + z * 0.025
    + Math.sin(z * 0.045) * 1.5
    + Math.sin(x * 0.12 + z * 0.025) * 0.8;
}

const positions = [];
const indices = [];
const segmentsX = 80;
const segmentsZ = 400;

for (let iz = 0; iz <= segmentsZ; iz++) {
  for (let ix = 0; ix <= segmentsX; ix++) {
    const x = -50 + ix * 100 / segmentsX;
    const z = 30 - iz * 430 / segmentsZ;
    positions.push(x, mountainHeight(x, z), z);
  }
}

for (let iz = 0; iz < segmentsZ; iz++) {
  for (let ix = 0; ix < segmentsX; ix++) {
    const a = iz * (segmentsX + 1) + ix;
    const b = a + 1;
    const c = a + segmentsX + 1;
    const d = c + 1;
    indices.push(a, c, b, b, c, d);
  }
}

const terrainGeometry = new THREE.BufferGeometry();
terrainGeometry.setAttribute(
  "position", new THREE.Float32BufferAttribute(positions, 3)
);
terrainGeometry.setIndex(indices);
terrainGeometry.computeVertexNormals();

const snow = new THREE.Mesh(
  terrainGeometry,
  new THREE.MeshStandardMaterial({
    color: 0xeaf5ff,
    roughness: 0.95,
    side: THREE.DoubleSide
  })
);
snow.receiveShadow = true;
scene.add(snow);

// SKIER
const skier = new THREE.Group();
scene.add(skier);

const dark = new THREE.MeshStandardMaterial({ color: 0x172b45 });
const jacket = new THREE.MeshStandardMaterial({ color: 0xe84d36 });
const helmet = new THREE.MeshStandardMaterial({ color: 0xffd447 });

function part(parent, geometry, material, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

part(skier, new THREE.BoxGeometry(0.48, 0.85, 0.35),
  jacket, 0, 0.85, 0);

part(skier, new THREE.SphereGeometry(0.24, 16, 12),
  helmet, 0, 1.48, 0);

part(skier, new THREE.CylinderGeometry(0.07, 0.08, 0.65),
  dark, -0.32, 0.85, 0);

part(skier, new THREE.CylinderGeometry(0.07, 0.08, 0.65),
  dark, 0.32, 0.85, 0);

// Skis
part(skier, new THREE.BoxGeometry(0.25, 0.08, 2.1),
  dark, -0.22, 0.12, 0);

part(skier, new THREE.BoxGeometry(0.25, 0.08, 2.1),
  dark, 0.22, 0.12, 0);

// TREES AND ROCKS
const obstacles = [];

function addTree(x, z) {
  const tree = new THREE.Group();

  part(tree, new THREE.CylinderGeometry(0.15, 0.2, 1.6),
    new THREE.MeshStandardMaterial({ color: 0x62452e }),
    0, 0.8, 0);

  for (let i = 0; i < 3; i++) {
    part(tree, new THREE.ConeGeometry(1.0 - i * 0.18, 1.8),
      new THREE.MeshStandardMaterial({ color: 0x174d39 }),
      0, 1.8 + i * 0.75, 0);
  }

  tree.position.set(x, mountainHeight(x, z), z);
  scene.add(tree);
  obstacles.push({ x, z, radius: 1.0 });
}

function addRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.8),
    new THREE.MeshStandardMaterial({ color: 0x87939b })
  );
  rock.position.set(x, mountainHeight(x, z) + 0.5, z);
  rock.castShadow = true;
  scene.add(rock);
  obstacles.push({ x, z, radius: 1.0 });
}

for (let z = -20; z > -400; z -= 12) {
  for (const side of [-1, 1]) {
    const x = side * (13 + Math.random() * 20);
    if (Math.random() > 0.2) addTree(x, z);
  }

  if (Math.random() > 0.65) {
    addRock((Math.random() - 0.5) * 17, z - 5);
  }
}

// GAME STATE
const keys = {};
let speed = 0;
let lateralSpeed = 0;
let score = 0;
let tricks = 0;
let jumpVelocity = 0;
let airborne = false;
let flipRotation = 0;
let flipActive = false;
let distance = 0;
let crashed = false;

function restart() {
  speed = 12;
  lateralSpeed = 0;
  score = 0;
  tricks = 0;
  distance = 0;
  jumpVelocity = 0;
  airborne = false;
  flipRotation = 0;
  flipActive = false;
  crashed = false;
  skier.position.set(0, mountainHeight(0, 0) + 0.4, 0);
  skier.rotation.set(0, 0, 0);
  document.getElementById("message").textContent = "";
}

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space" && !airborne && !crashed) {
    jumpVelocity = 10;
    airborne = true;
  }

  if (e.key.toLowerCase() === "f" && airborne && !flipActive) {
    flipActive = true;
  }

  if (e.key.toLowerCase() === "r") restart();
});

addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// MAIN GAME LOOP
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (!crashed) {
    // Steering and momentum
    let steering = 0;
    if (keys.a || keys.arrowleft) steering = -1;
    if (keys.d || keys.arrowright) steering = 1;

    lateralSpeed += steering * 16 * dt;
    lateralSpeed *= Math.pow(0.94, dt * 60);
    lateralSpeed = THREE.MathUtils.clamp(lateralSpeed, -10, 10);

    speed = Math.min(speed + dt * 0.7, 32);

    skier.position.x += lateralSpeed * dt;
    skier.position.z -= speed * dt;
    distance += speed * dt;

    // Keep the player on the mountain
    const ground = mountainHeight(skier.position.x, skier.position.z);

    if (airborne) {
      jumpVelocity -= 24 * dt;
      skier.position.y += jumpVelocity * dt;

      if (flipActive) {
        flipRotation += dt * 9;
        skier.rotation.x = flipRotation;

        if (flipRotation >= Math.PI * 2) {
          flipActive = false;
          flipRotation = 0;
          skier.rotation.x = 0;
          tricks++;
          score += 500;
        }
      }

      if (skier.position.y <= ground + 0.4 && jumpVelocity < 0) {
        skier.position.y = ground + 0.4;
        airborne = false;
        jumpVelocity = 0;
        skier.rotation.x = 0;
      }
    } else {
      skier.position.y = ground + 0.4;
    }

    // Lean into turns
    skier.rotation.z = THREE.MathUtils.lerp(
      skier.rotation.z, -lateralSpeed * 0.045, 0.12
    );

    // Obstacle collisions
    for (const obstacle of obstacles) {
      const dx = skier.position.x - obstacle.x;
      const dz = skier.position.z - obstacle.z;

      if (Math.hypot(dx, dz) < obstacle.radius) {
        crashed = true;
        document.getElementById("message").textContent =
          "CRASH! PRESS R TO RESTART";
        break;
      }
    }

    score += Math.floor(speed * dt);

    if (Math.abs(skier.position.x) > 42) {
      crashed = true;
      document.getElementById("message").textContent =
        "OFF THE COURSE! PRESS R";
    }

    document.getElementById("speed").textContent =
      "Speed: " + Math.round(speed * 3.6) + " km/h";

    document.getElementById("score").textContent =
      "Score: " + score;

    document.getElementById("tricks").textContent =
      "Tricks: " + tricks;
  }

  // FOLLOW CAMERA
  const targetCamera = new THREE.Vector3(
    skier.position.x * 0.65,
    skier.position.y + 5,
    skier.position.z + 11
  );

  camera.position.lerp(targetCamera, 0.09);
  camera.lookAt(
    skier.position.x,
    skier.position.y + 1,
    skier.position.z - 9
  );

  renderer.render(scene, camera);
}

restart();
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
